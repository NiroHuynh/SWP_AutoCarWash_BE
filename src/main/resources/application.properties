# =====================================================
# APPLICATION CONFIGURATION
# =====================================================
# Configure active profile (e.g., dev, prod)
spring.profiles.active=pro

# Application name
spring.application.name=AutoCarWash

# Server port
server.port=8080


# =====================================================
# DATABASE CONFIGURATION (MySQL)
# =====================================================

# spring.datasource.url=jdbc:mysql://localhost:3306/swp_auto_car_wash?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/swp_auto_car_wash?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
spring.datasource.username=root
spring.datasource.password=12345

# MySQL driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA / HIBERNATE CONFIGURATION
# =====================================================

# Auto create/update database tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL query in console
spring.jpa.show-sql=true

# Format SQL output
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =====================================================
# DATABASE INITIALIZATION
# =====================================================

# Enable data.sql execution for MySQL
spring.sql.init.mode=always

# Run data.sql after Hibernate create/update table
spring.jpa.defer-datasource-initialization=true

# Location of seed file
spring.sql.init.data-locations=classpath:data.sql

# Continue startup even if seed has small errors
spring.sql.init.continue-on-error=false

# =====================================================
# LOGGING
# =====================================================

logging.level.org.springframework.transaction=TRACE

# Show SQL parameters
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Hibernate SQL log
logging.level.org.hibernate.SQL=DEBUG


# =====================================================
# SPRING SECURITY
# =====================================================




# Disable default generated password log
logging.level.org.springframework.security=DEBUG



# =====================================================
# DEVTOOLS
# =====================================================

# Enable restart
spring.devtools.restart.enabled=true

# Disable cache during development
spring.web.resources.cache.period=0


# =====================================================
# FILE UPLOAD (Vehicle Image)
# =====================================================

# Max file size
spring.servlet.multipart.max-file-size=5MB

# Max request size
spring.servlet.multipart.max-request-size=10MB


# =====================================================
# JACKSON JSON
# =====================================================

# Date format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Timezone
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Cấu hình Secret Key cho JWT
app.jwt.secret=lCTQgQduCxIpbVQ6nAa2xIyAUlxJa5PKerroONfuJAu
#Cấu hình thời gain hết hạn của token jwt
app.jwt.expiration-ms=86400000